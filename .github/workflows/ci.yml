name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Regenerate CommonJS build
        run: node scripts/build-cjs.mjs
      - name: Run test suite
        run: npm test
      - name: Verify zero runtime dependencies
        run: node -e "const p=require('./package.json'); if(Object.keys(p.dependencies).length!==0) process.exit(1)"
      - name: Pack dry run
        run: npm pack --dry-run
